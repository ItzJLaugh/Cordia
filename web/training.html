<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cordia Training &mdash; Certification</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/cordia-ui.css">
<style>
  .site{display:flex;align-items:center;padding:22px 0 0}
  .site .shell{display:flex;align-items:center;width:100%}
  .site img.wm{height:30px;width:auto}
  .site .acct{margin-left:auto}
  .certs{padding:44px 0 0}
  .sec-h{text-align:center;margin:0 0 26px}
  .finder-wrap{max-width:720px;margin:48px auto 0}
  .cat{margin:66px 0 0}
  .cat:first-child{margin-top:56px}
  .results{margin:48px 0 0}
  .results-empty{padding:26px 0 0;font-size:var(--t-base);color:var(--c-ink-3)}
  .win-env{color:var(--c-ink-4);font-weight:500;text-transform:none;letter-spacing:0}
  .sheet-title{font-family:var(--f-title);font-optical-sizing:auto;font-weight:500;
    font-size:var(--t-xl);line-height:var(--lh-title);color:var(--c-ink);margin:6px 0 22px}
  footer{padding:110px 0 70px;text-align:center;font-family:var(--f-label);
    font-size:var(--t-xs);letter-spacing:.12em;text-transform:uppercase;color:var(--c-ink-4)}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>

<header id="shellHeader"></header>

<main id="main">
  <section class="certs" aria-labelledby="certs-h">
    <div class="shell">
      <p class="eyebrow sec-h" id="certs-h">Certification</p>
      <ul class="cert-row" id="certRow" role="list"></ul>
    </div>
  </section>

  <div class="shell">
    <div class="finder-wrap">
      <search class="finder" id="finder" role="search">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="1.8" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" autocomplete="off" spellcheck="false"
               role="combobox" aria-expanded="false" aria-controls="results"
               aria-label="Search the catalogue"
               placeholder="Name the work you actually do&hellip;">
        <span class="finder-bar" aria-hidden="true"></span>
      </search>
      <p id="qStatus" class="vh" role="status" aria-live="polite"></p>
    </div>

    <section class="results" id="results" hidden aria-label="Search results">
      <ol class="win-grid" id="resultGrid" role="list"></ol>
      <div class="results-empty" id="resultsEmpty" hidden></div>
    </section>

    <div id="catalogue"></div>
  </div>

  <footer>Cordia &middot; Training &amp; Certification</footer>
</main>

<div class="detail" id="detail" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="scrim" data-close></div>
  <div class="sheet" id="sheet"></div>
</div>

<script src="assets/curriculum-tiers.js"></script>
<script src="assets/curriculum-tracks-a.js"></script>
<script src="assets/curriculum-tracks-b.js"></script>
<script src="assets/curriculum-tracks-c.js"></script>
<script src="assets/curriculum-groups.js"></script>
<script src="assets/cordia-icons.js"></script>
<script src="assets/cordia-shell.js" data-nav="training"></script>
<script src="assets/cordia-chooser.js"></script>
</body>
</html>
