<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cordia — Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/cordia.css">
<link rel="stylesheet" href="assets/cordia-ui.css">
<link rel="stylesheet" href="assets/cordia-logo.css">
<style>
  body{min-height:100vh;overflow-x:hidden;background:var(--c-bg)}

  /* Single centred column. The previous two-column grid left a large empty
     band on wide screens because the right-hand card was pinned to the edge
     while the left column ran out of content. Centring removes the gap
     instead of trying to fill it. */
  .login{position:relative;z-index:2;min-height:100vh;display:flex;
    flex-direction:column;align-items:center;justify-content:center;
    gap:26px;padding:40px 22px 48px;max-width:520px;margin:0 auto;text-align:center}

  .mark{height:24px;width:auto;display:block}
  .statement{font-family:var(--f-ui);font-weight:800;
    font-size:clamp(30px,5.2vw,46px);line-height:1.02;letter-spacing:-.035em;
    color:var(--c-ink);margin:0}
  .statement em{font-style:normal;color:var(--c-ink-3)}
  .statement-sub{font-size:var(--t-sm);line-height:1.6;color:var(--c-ink-3);
    margin:0;max-width:34ch}

  /* ---- auth card: sits over the tree, deliberately overlapping it ---- */
  .auth-card{width:100%;max-width:392px;position:relative;z-index:3;
    animation:rise .7s cubic-bezier(.22,.8,.3,1)}
  @keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
  .auth-body{padding:28px 28px 24px;background:var(--c-surface);
    border-radius:var(--r-md);box-shadow:var(--e-3);text-align:left}
  .auth-title{font-family:var(--f-title);font-optical-sizing:auto;font-weight:500;
    font-size:var(--t-lg);color:var(--c-ink);margin:0 0 18px}
  .auth-tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--c-wash);
    border-radius:var(--r-sm);padding:4px}
  .auth-tabs button{flex:1;padding:9px;border:none;border-radius:8px;cursor:pointer;
    font-family:var(--f-ui);font-size:13px;font-weight:600;color:var(--c-ink-3);
    background:transparent;transition:background .2s,color .2s}
  .auth-tabs button.active{background:var(--c-surface);color:var(--c-ink);box-shadow:var(--e-1)}
  .auth-error{display:none;background:rgba(138,62,42,.07);
    color:#8A3E2A;font-size:13px;padding:11px 14px;border-radius:var(--r-sm);margin-bottom:16px}
  .auth-foot{text-align:center;margin-top:18px;font-size:13px;color:var(--c-ink-3)}
  .auth-foot a{font-weight:600;color:var(--c-ink)}
  .demo-note{margin-top:18px;padding-top:15px;border-top:1px solid var(--c-hair);
    font-family:var(--f-label);font-size:11px;color:var(--c-ink-4);
    text-align:center;line-height:1.6}

  /* ---- the tree / neural network ---- */
  /* Centred and full-height rather than pushed into a corner: the form sits on
     top of it, so the trunk reads behind the card and the root network spreads
     out beneath. Kept to a light transparent grey so it never competes with
     the form it sits under. */
  .tree{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);
    width:100vw;height:auto;aspect-ratio:1.6/1;z-index:0;
    pointer-events:none;color:var(--c-ink);opacity:.16}
  @media (min-width:1000px){.tree{width:min(100vw,1680px);opacity:.18}}
  @media (max-width:640px){.tree{opacity:.11;width:230vw}}
</style>
</head>
<body>

<div class="cordia-loader" id="loader">
  <img src="/assets/img/cordia-icon.png" alt="" style="height:64px;width:auto;display:block;margin:0 auto">
  <div class="load-word">Entering your space</div>
</div>

<svg class="tree" id="treeGraph" aria-hidden="true"></svg>

<div class="login">
  <img class="mark" src="assets/img/cordia-logo-header.webp" alt="Cordia" width="382" height="60">
  <h1 class="statement">I see humans,<br>but no <em>humanity.</em></h1>
  <p class="statement-sub">AI adoption fails on <b>intent</b>, not capability.
    Cordia measures that.</p>

  <div class="auth-card">
    <div class="auth-body">
      <h2 class="auth-title">Sign in</h2>

      <div class="auth-tabs">
        <button id="tabLogin" class="active" type="button">Sign in</button>
        <button id="tabSignup" type="button">Create account</button>
      </div>

      <div class="auth-error" id="authError"></div>

      <form id="authForm" autocomplete="off">
        <div class="field" id="nameField" style="display:none">
          <label for="name">Full name</label>
          <input id="name" type="text" placeholder="Ada Lovelace">
        </div>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="you@studio.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" type="password" placeholder="••••••••" required minlength="6">
        </div>
        <div class="field" id="codeField" style="display:none">
          <label for="code">Verification code</label>
          <input id="code" type="text" inputmode="numeric" placeholder="6-digit code" maxlength="6">
          <div id="devCodeNote" style="display:none;font-family:var(--f-label);font-size:12px;color:#7A5B2E;margin-top:8px"></div>
        </div>
        <button class="btn btn-primary" type="submit" style="width:100%" id="submitBtn">Sign in</button>
      </form>

      <div class="auth-foot">
        <span id="footText">New to Cordia? <a href="#" id="footLink">Create an account</a></span>
      </div>

      <div class="demo-note">
Email-verified. Passwords hashed server-side.
      </div>
    </div>
  </div>
</div>

<script src="assets/cordia-treegraph.js"></script>
<script>
CordiaTreeGraph.mount(document.getElementById('treeGraph'));

/* ================= auth logic — unchanged ================= */
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  ? 'http://127.0.0.1:9995'
  : location.protocol + '//' + location.hostname + (location.protocol === 'https:' ? '' : ':9995'));

/* --- session restore: 14-day token in localStorage means "remembered" --- */
(function restore(){
  const token = localStorage.getItem('cordia-token');
  if(!token) return;
  fetch(API + '/auth/me', {headers: {'Authorization': 'Bearer ' + token}})
    .then(r => r.json())
    .then(d => {
      if(d.ok && d.user){
        sessionStorage.setItem('cordia-auth','1');
        sessionStorage.setItem('cordia-user', d.user.email);
        localStorage.setItem('cordia-learner', d.user.email);
        location.replace('surveyor.html');
      } else {
        localStorage.removeItem('cordia-token');
      }
    })
    .catch(() => {});
})();
const tabLogin = document.getElementById('tabLogin');
const tabSignup = document.getElementById('tabSignup');
const nameField = document.getElementById('nameField');
const codeField = document.getElementById('codeField');
const devCodeNote = document.getElementById('devCodeNote');
const submitBtn = document.getElementById('submitBtn');
const footText = document.getElementById('footText');
const errBox = document.getElementById('authError');
const loader = document.getElementById('loader');
let mode = 'login';
let awaitingCode = false;

function setMode(m){
  mode = m;
  awaitingCode = false;
  codeField.style.display = 'none';
  tabLogin.classList.toggle('active', m==='login');
  tabSignup.classList.toggle('active', m==='signup');
  nameField.style.display = m==='signup' ? 'block' : 'none';
  submitBtn.textContent = m==='login' ? 'Sign in' : 'Create account';
  footText.innerHTML = m==='login'
    ? 'New to Cordia? <a href="#" id="footLink">Create an account</a>'
    : 'Already have an account? <a href="#" id="footLink">Sign in</a>';
  errBox.style.display = 'none';
}
tabLogin.onclick = () => setMode('login');
tabSignup.onclick = () => setMode('signup');
footText.onclick = e => { if(e.target.id==='footLink'){ e.preventDefault(); setMode(mode==='login'?'signup':'login'); } };

async function api(path, body){
  const r = await fetch(API + path, {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  return r.json();
}

function showErr(msg){ errBox.textContent = msg; errBox.style.display = 'block'; }

function enterSpace(token, email){
  sessionStorage.setItem('cordia-auth','1');
  sessionStorage.setItem('cordia-user', email);
  localStorage.setItem('cordia-token', token);
  localStorage.setItem('cordia-learner', email);
  loader.classList.add('show');
  setTimeout(() => location.replace('surveyor.html'), 1400);
}

document.getElementById('authForm').onsubmit = async e => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim().toLowerCase();
  const pass = document.getElementById('password').value;
  const name = document.getElementById('name').value.trim();
  const code = document.getElementById('code').value.trim();
  submitBtn.disabled = true;
  try {
    if(!awaitingCode){
      const d = await api(mode === 'signup' ? '/auth/signup' : '/auth/login',
        mode === 'signup' ? {email, name, password: pass} : {email, password: pass});
      if(!d.ok){ showErr(d.msg || 'Something went wrong.'); return; }
      awaitingCode = true;
      codeField.style.display = 'block';
      submitBtn.textContent = 'Verify code';
      if(d.dev_code){
        devCodeNote.style.display = 'block';
        devCodeNote.textContent = `Dev mode (email not configured): your code is ${d.dev_code}`;
      } else if(mode === 'signup'){
        // Signup deliberately gives the same response whether or not the address
        // already has an account — otherwise anyone could test an email and learn
        // who has one. That means we genuinely cannot tell the person which case
        // they are in, so say so plainly rather than promising a code that may
        // never arrive.
        devCodeNote.style.display = 'block';
        devCodeNote.textContent = 'Check your email. If this address is already '
          + 'registered we’ve told you that instead of sending a code — '
          + 'sign in below rather than signing up.';
      } else {
        devCodeNote.style.display = 'none';
      }
      document.getElementById('code').focus();
    } else {
      if(!code){ showErr('Enter the 6-digit code.'); return; }
      const d = await api(mode === 'signup' ? '/auth/verify-signup' : '/auth/verify-login',
        {email, code});
      if(!d.ok){ showErr(d.msg || 'Verification failed.'); return; }
      enterSpace(d.token, email);
    }
  } catch(err){
    showErr('Server unreachable — is the backend running?');
  } finally {
    submitBtn.disabled = false;
  }
};
</script>
</body>
</html>
