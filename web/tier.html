<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cordia Training — Tier</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Source+Serif+4:opsz,wght@8..60,400;8..60,500;8..60,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/cordia.css">
<link rel="stylesheet" href="assets/cordia-ui.css">
<link rel="stylesheet" href="assets/cordia-logo.css">
<style>
.tier-head{padding:44px 0 8px}
.crumbs{font-family:var(--sans);font-size:12px;color:var(--grey);margin-bottom:16px}
.crumbs a{color:var(--sage-deep)}
.tier-hero{border-radius:var(--radius);padding:44px 44px 38px;margin-bottom:26px;position:relative;overflow:hidden;color:#fff}
.th-badge{width:96px;height:96px;border-radius:50%;object-fit:cover;border:3px solid rgba(255,255,255,.6);box-shadow:0 8px 28px rgba(0,0,0,.35);margin-bottom:18px}
.tier-hero .th-code{font-family:var(--serif);font-size:clamp(30px,4vw,44px);letter-spacing:.05em}
.tier-hero .th-name{font-family:var(--sans);font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;opacity:.85;margin-top:4px}
.tier-hero .th-claim{font-family:var(--body);font-style:italic;font-size:clamp(16px,2vw,20px);margin-top:18px;max-width:60ch;line-height:1.5;opacity:.95}
.tier-grid2{display:grid;grid-template-columns:1fr 340px;gap:24px;padding-bottom:90px}
@media(max-width:900px){.tier-grid2{grid-template-columns:1fr}}
.t-course{padding:20px 26px;margin-bottom:13px;display:flex;gap:18px;align-items:flex-start}
.t-num{flex-shrink:0;width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:16px;color:#fff;background:linear-gradient(135deg,var(--sage-deep),var(--olive-deep))}
.t-course h4{font-size:16px;margin-bottom:4px}
.t-course p{font-family:var(--sans);font-size:13px;color:var(--grey);line-height:1.6}
.t-side .glass{padding:24px;margin-bottom:16px}
.t-side h4{font-family:var(--sans);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--grey);margin-bottom:10px}
.t-side p{font-family:var(--sans);font-size:13px;color:var(--ink-soft);line-height:1.65}
</style>
</head>
<body>
<header id="shellHeader"></header>

<div class="shell">
  <div class="tier-head">
    <div class="crumbs"><a href="training.html">Training</a> / <span id="crumbTier"></span></div>
    <div class="tier-hero" id="tierHero">
      <img id="tierBadge" class="th-badge" alt="tier emblem">
      <div class="th-code" id="tierCode"></div>
      <div class="th-name" id="tierName"></div>
      <div class="th-claim" id="tierClaim"></div>
    </div>
  </div>

  <div class="tier-grid2">
    <div id="tierCourses"></div>
    <div class="t-side">
      <div class="glass"><h4>Who this is for</h4><p id="tierWho"></p></div>
      <div class="glass"><h4>Assessment mix</h4><p id="tierMix"></p></div>
      <div class="glass"><h4>Signature item</h4><p id="tierSig"></p></div>
      <div class="glass"><h4>Cut score logic</h4><p id="tierCut"></p></div>
    </div>
  </div>
</div>

<script src="assets/curriculum-tiers.js"></script>
<script src="assets/cordia-auth.js"></script>
<script>document.body.setAttribute('data-auth-gate','');</script>
<script>
const API = (location.hostname === 'localhost' || location.hostname === '127.0.0.1'
  ? 'http://127.0.0.1:9995'
  : location.protocol + '//' + location.hostname + (location.protocol === 'https:' ? '' : ':9995'));
/* sign-out handled by cordia-shell.js */
const id = new URLSearchParams(location.search).get('tier') || 'aie';
const T = TIERS.find(t => t.id === id) || TIERS[0];
document.getElementById('crumbTier').textContent = T.code;
document.getElementById('tierCode').textContent = T.code;
document.getElementById('tierName').textContent = T.name;
document.getElementById('tierClaim').textContent = '"' + T.claim + '"';
document.getElementById('tierHero').style.background = `linear-gradient(120deg,${T.g[0]},${T.g[1]})`;
document.getElementById('tierBadge').src = T.badge;
document.getElementById('tierWho').textContent = T.who;
document.getElementById('tierMix').textContent = T.mix;
document.getElementById('tierSig').textContent = T.signature;
document.getElementById('tierCut').textContent = T.cut;
document.getElementById('tierCourses').innerHTML = T.courses.map((c,i) => {
  // CordiaAIE course 1 has full content; others are scaffolds
  const live = (T.id === 'aie' && i === 0);
  const inner = `<div class="t-num">${i+1}</div>
    <div><h4>${c.t} ${live ? '<span class="pill green" style="margin-left:8px">start now</span>' : ''}</h4><p>${c.m}</p></div>`;
  return live
    ? `<a href="learn.html" style="text-decoration:none;color:inherit"><div class="glass t-course card-hover">${inner}</div></a>`
    : `<div class="glass t-course">${inner}</div>`;
}).join('');
document.title = `Cordia — ${T.code}`;
</script>
<script src="assets/cordia-shell.js" data-nav="certifications"></script>
</body>
</html>
