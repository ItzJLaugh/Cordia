<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Surveyor &mdash; Cordia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/cordia-ui.css">
<style>
  .page{padding:44px 0 96px}
  .lede{max-width:620px}
  .eyebrow{font-family:var(--f-label);font-size:var(--t-xs);letter-spacing:var(--tr-caps);
    text-transform:uppercase;color:var(--c-ink-3);margin:0 0 12px}
  h1{font-family:var(--f-title);font-optical-sizing:auto;font-weight:500;
    font-size:var(--t-2xl);line-height:var(--lh-title);color:var(--c-ink);margin:0 0 14px}
  p{font-size:var(--t-base);line-height:var(--lh-body);color:var(--c-ink-2);margin:0 0 16px}
  .btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;
    background:var(--c-moss);color:#fff;border-radius:var(--r-pill);padding:12px 22px;
    font-family:var(--f-label);font-size:var(--t-xs);letter-spacing:var(--tr-caps);
    text-transform:uppercase;text-decoration:none;margin:10px 0 0}
  .btn:hover{opacity:.9}
</style>
</head>
<body>

<header id="shellHeader"></header>

<main id="main" class="page">
  <div class="shell">
    <div class="lede">
      <p class="eyebrow">Intake</p>
      <h1>Surveyor</h1>
      <p>A short conversation, not a test. Surveyor asks how you think and work so Cordia can
        shape a workspace around you. Nothing here is graded, and nothing you say affects any
        certification result.</p>
      <p>It should take a few minutes. You can stop and come back — Surveyor remembers.</p>
      <button class="btn" type="button" data-surveyor>Talk to Surveyor</button>
    </div>
  </div>
</main>

<script src="assets/cordia-shell.js?v=93dc4041" data-nav="surveyor"></script>
<script>
  // Direct-link fallback: Surveyor is a modal, so opening this page opens it.
  addEventListener('load', function () {
    setTimeout(function () {
      if (window.Cordia && window.Cordia.surveyor) window.Cordia.surveyor.open();
    }, 260);
  });
</script>
</body>
</html>
