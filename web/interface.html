<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Run Interface &mdash; Cordia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/cordia-ui.css">
<style>
  .page{padding:36px 0 96px}
  .eyebrow{font-family:var(--f-label);font-size:var(--t-xs);letter-spacing:var(--tr-caps);
    text-transform:uppercase;color:var(--c-ink-3);margin:0 0 10px}
  h1{font-family:var(--f-title);font-optical-sizing:auto;font-weight:500;
    font-size:var(--t-xl);line-height:var(--lh-title);color:var(--c-ink);margin:0 0 8px}
  .desc{font-size:var(--t-sm);line-height:var(--lh-body);color:var(--c-ink-2);margin:0 0 28px;
    max-width:640px}
  .grid{display:grid;gap:24px;grid-template-columns:minmax(0,1fr) 290px;align-items:start}
  @media (max-width:920px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--c-surface);border-radius:var(--r-lg);padding:24px;box-shadow:var(--e-1)}
  .panel.wash{background:var(--c-wash);box-shadow:none}
  .lbl{font-family:var(--f-label);font-size:var(--t-xs);letter-spacing:var(--tr-caps);
    text-transform:uppercase;color:var(--c-ink-3);margin:0 0 12px;display:block}
  textarea{width:100%;border:1px solid var(--c-hair);border-radius:12px;padding:12px 14px;
    font:inherit;font-size:var(--t-sm);line-height:var(--lh-body);color:var(--c-ink);
    min-height:110px;resize:vertical;background:#fff}
  textarea:focus{outline:2px solid var(--c-moss);outline-offset:-1px;border-color:transparent}
  .btn{display:inline-flex;align-items:center;gap:8px;border:0;cursor:pointer;
    background:var(--c-moss);color:#fff;border-radius:var(--r-pill);padding:11px 20px;
    font-family:var(--f-label);font-size:var(--t-xs);letter-spacing:var(--tr-caps);
    text-transform:uppercase;text-decoration:none}
  .btn.ghost{background:transparent;color:var(--c-ink-2);border:1px solid var(--c-hair)}
  .btn:hover{opacity:.9}
  .btn[disabled]{opacity:.45;cursor:default}
  .actions{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0 0}
  .out{margin:26px 0 0;padding:22px;background:var(--c-wash);border-radius:var(--r-md);
    font-size:var(--t-sm);line-height:var(--lh-body);color:var(--c-ink);white-space:pre-wrap;
    word-wrap:break-word}
  .feedback{margin:14px 0 0;padding:16px;background:var(--c-wash);border-radius:var(--r-md)}
  .feedback select,.feedback input{width:100%;box-sizing:border-box;border:1px solid var(--c-hair);border-radius:8px;padding:9px 10px;margin:0 0 8px;font:inherit;font-size:var(--t-xs);background:#fff}
  .step{display:flex;gap:11px;padding:11px 0;border-bottom:1px solid var(--c-hair);
    font-size:var(--t-sm);color:var(--c-ink-2)}
  .step:last-child{border-bottom:0}
  .step i{font-family:var(--f-label);font-size:var(--t-xs);color:var(--c-ink-4);
    font-style:normal;flex:0 0 18px;font-variant-numeric:tabular-nums}
  .gate{font-family:var(--f-label);font-size:10px;letter-spacing:.1em;text-transform:uppercase;
    color:#7A5B2E;background:#FBF6EC;border-radius:999px;padding:3px 8px;align-self:flex-start;
    white-space:nowrap}
  .native-window{margin:20px 0 0;padding-top:20px;border-top:1px solid var(--c-hair)}
  .repo{display:block;padding:10px 0;border-bottom:1px solid var(--c-hair);text-decoration:none;color:var(--c-ink)}
  .repo:last-child{border-bottom:0}.repo-name{font-family:var(--f-label);font-size:var(--t-xs)}
  .repo-meta{display:block;margin-top:3px;color:var(--c-ink-3);font-size:var(--t-xs)}
  .approval{margin:16px 0 0;padding:14px;border:1px solid #E9D5AE;border-radius:var(--r-md);background:#FFF9ED}
  .approval p{font-size:var(--t-xs);line-height:1.5;margin:0 0 10px;color:var(--c-ink-2)}
  .window-form{margin:16px 0 0;display:flex;gap:8px}.window-form input{flex:1;min-width:0;border:1px solid var(--c-hair);border-radius:var(--r-pill);padding:9px 12px;font:inherit;font-size:var(--t-xs)}
  .notice{margin:0 0 20px;padding:11px 15px;border-radius:10px;background:#FBF6EC;
    color:#7A5B2E;font-size:var(--t-xs);font-family:var(--f-label);line-height:1.5}
  .alidora-nav{display:block;margin:18px 0 0;padding:14px 0 0;border-top:1px solid var(--c-hair);color:var(--c-ink);text-decoration:none}
  .alidora-nav strong,.alidora-nav small{display:block}.alidora-nav strong{font-family:var(--f-label);font-size:var(--t-xs);letter-spacing:var(--tr-caps);text-transform:uppercase}
  .alidora-nav small{margin-top:4px;color:var(--c-ink-3);font-size:var(--t-xs)}
</style>
</head>
<body>

<header id="shellHeader"></header>

<main id="main" class="page">
  <div class="shell">
    <p class="eyebrow">Workspace</p>
    <h1 id="title">Loading…</h1>
    <p class="desc" id="desc"></p>
    <div class="notice" id="notice" hidden></div>

    <div class="grid">
      <section class="panel" id="cordiaAgentPanel" data-surface="primary" aria-label="Cordia Agent">
        <span class="lbl" id="cordiaAgentLabel">Cordia Agent</span>
        <textarea id="input" placeholder="What do you want this workspace to do?"
          aria-label="Your request"></textarea>
        <div class="actions">
          <button class="btn" type="button" id="runBtn">Run</button>
          <a class="btn ghost" id="editLink" href="builder.html">Edit interface</a>
        </div>
        <div class="out" id="out" hidden></div>
        <form class="window-form" id="windowForm"><input id="windowTitle" maxlength="120" placeholder="Add a workspace note" aria-label="New workspace window"><button class="btn ghost" type="submit">Add</button></form>
        <div id="approvals"></div>
        <form class="feedback" id="feedback" hidden>
          <span class="lbl">Refine Cordia's understanding</span>
          <select id="missCategory" aria-label="What missed the mark">
            <option value="needs_evidence">Needs evidence</option><option value="missing_context">Missing context</option>
            <option value="wrong_audience">Wrong audience</option><option value="too_generic">Too generic</option>
            <option value="wrong_format">Wrong format</option><option value="wrong_constraint">Wrong constraint</option>
            <option value="unsafe_to_automate">Unsafe to automate</option><option value="needs_human_checkpoint">Needs human checkpoint</option>
          </select>
          <input id="missCorrection" maxlength="600" placeholder="What should Cordia do differently?" aria-label="Correction">
          <input id="missEffect" maxlength="600" placeholder="How should future work change?" aria-label="Future effect">
          <button class="btn ghost" type="submit">Save correction</button>
        </form>
      </section>

      <aside class="panel wash">
        <span class="lbl">Workflow</span>
        <div id="steps"></div>
        <div id="nativeWindows"></div>
        <nav id="alidoraNav" aria-label="Workspace modules"></nav>
      </aside>
    </div>
  </div>
</main>

<script src="assets/cordia-shell.js?v=93dc4041" data-nav="workspace"></script>
<script src="assets/workspace-navigation.js?v=1"></script>
<script>
(function () {
  'use strict';
  var API = location.hostname === 'localhost' ? 'http://127.0.0.1:9995' : '';
  var id = new URLSearchParams(location.search).get('id') || '';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }
  function api(path, body) {
    return fetch(API + path, {
      method: body ? 'POST' : 'GET',
      credentials:'same-origin',
      body: body ? JSON.stringify(body) : undefined
    }).then(function (r) {
      return r.json().catch(function () { return {}; })
        .then(function (d) { return { code: r.status, data: d }; });
    });
  }
  function show(text) {
    var o = document.getElementById('out');
    o.hidden = false;
    o.textContent = text;
    document.getElementById('feedback').hidden = false;
  }
  function notice(text) {
    if (!text) return;
    var n = document.getElementById('notice');
    n.hidden = false; n.textContent = text;
  }
  function renderGithubWindow() {
    var host = document.getElementById('nativeWindows');
    host.insertAdjacentHTML('beforeend', '<section class="native-window" id="githubWindow"><span class="lbl">GitHub repositories</span><div class="step"><span>Loading connected repositoriesâ€¦</span></div></section>');
    var windowHost = document.getElementById('githubWindow');
    api('/surveyor/github/repositories').then(function (r) {
      var repos = r.data && r.data.repositories;
      if (r.code !== 200 || !Array.isArray(repos)) {
        windowHost.innerHTML = '<span class="lbl">GitHub repositories</span><div class="step"><span>Connection needs attention. <a href="github.html">Open GitHub setup</a></span></div>';
        return;
      }
      var scope = r.data.repository_limit ? '<div class="step"><span>Showing up to ' + esc(r.data.repository_limit) + ' recently updated repositories.</span></div>' : '';
      windowHost.innerHTML = '<span class="lbl">GitHub repositories</span>' + scope +
        (repos.length ? repos.map(function (repo) {
          return '<div class="repo"><a target="_blank" rel="noreferrer" href="' + esc(repo.url) + '"><span class="repo-name">' + esc(repo.name) + '</span><span class="repo-meta">' + esc(repo.description || (repo.private ? 'Private repository' : 'Repository')) + '</span></a><button class="btn ghost" data-repo-context="' + esc(repo.name) + '" type="button" style="margin-top:8px;padding:6px 10px">Use as context</button></div>';
        }).join('') : '<div class="step"><span>No repositories found.</span></div>');
      windowHost.querySelectorAll('[data-repo-context]').forEach(function (button) {
        button.addEventListener('click', function () {
          api('/surveyor/workspace/mutate', { id: id, mutation: { kind: 'add_context_source', source: {
            kind: 'github_repository', id: button.getAttribute('data-repo-context'), label: button.getAttribute('data-repo-context') } } }).then(function (result) {
            if (result.code !== 200 || !result.data.workspace) { notice((result.data && result.data.error) || 'Could not add repository context.'); return; }
            render(result.data.workspace); notice('Repository added to Cordia context.');
          });
        });
      });
    }).catch(function () {
      windowHost.innerHTML = '<span class="lbl">GitHub repositories</span><div class="step"><span>Unable to load repositories right now.</span></div>';
    });
  }
  function renderApprovals() {
    var host = document.getElementById('approvals');
    api('/surveyor/approvals').then(function (r) {
      var approvals = r.data && r.data.approvals;
      if (r.code !== 200 || !Array.isArray(approvals) || !approvals.length) { host.innerHTML = ''; return; }
      host.innerHTML = approvals.map(function (approval) {
        return '<section class="approval" data-approval="' + esc(approval.id) + '"><span class="lbl">Approval needed</span><p>' + esc(approval.summary) + '</p><div class="actions"><button class="btn" data-approve="true">Record approval</button><button class="btn ghost" data-approve="false">Decline</button></div></section>';
      }).join('');
      host.querySelectorAll('button[data-approve]').forEach(function (button) {
        button.addEventListener('click', function () {
          var section = button.closest('[data-approval]');
          api('/surveyor/approval/decision', {id: section.getAttribute('data-approval'), approved: button.getAttribute('data-approve') === 'true'}).then(function (result) {
            if (result.code === 200 && result.data.ok) { notice(result.data.resume ? 'Approval recorded. The protected continuation is ready for the runtime when that action is implemented.' : 'Decision recorded.'); renderApprovals(); }
            else notice((result.data && result.data.error) || 'Could not record that decision.');
          });
        });
      });
    });
  }
  function renderCapabilities() {
    var host = document.getElementById('nativeWindows');
    api('/surveyor/capabilities').then(function (r) {
      var capabilities = r.data && r.data.capabilities;
      if (r.code !== 200 || !Array.isArray(capabilities) || !capabilities.length) return;
      host.insertAdjacentHTML('beforeend', '<section class="native-window"><span class="lbl">Cordia access</span>' + capabilities.map(function (capability) {
        var label = capability.decision === 'ALLOW' ? 'Can use' : capability.decision === 'ASK' ? 'Will ask' : 'Cannot use';
        return '<div class="step"><span style="flex:1">' + esc(capability.summary) + '</span><span class="gate">' + esc(label) + '</span></div>';
      }).join('') + '</section>');
    });
  }
  function renderConnectors(workspace) {
    var host = document.getElementById('nativeWindows');
    var connectors = workspace.connectors || [];
    if (!connectors.length) return;
    host.insertAdjacentHTML('beforeend', '<section class="native-window"><span class="lbl">Connected systems</span>' + connectors.map(function (connector) {
      var lifecycle = String(connector.lifecycle || connector.status || 'proposed').replace(/_/g, ' ');
      var implementation = connector.implementation_status === 'live' ? 'Available now' : 'Setup planned';
      return '<div class="step"><span style="flex:1">' + esc(connector.id.replace(/_/g, ' ')) + '<small style="display:block;color:var(--c-ink-3);margin-top:2px">' + esc(implementation) + '</small></span><span class="gate">' + esc(lifecycle) + '</span></div>';
    }).join('') + '</section>');
  }
  function renderSkills() {
    var host = document.getElementById('nativeWindows');
    api('/surveyor/skills').then(function (r) {
      var skills = r.data && r.data.skills;
      if (r.code !== 200 || !Array.isArray(skills) || !skills.length) return;
      host.insertAdjacentHTML('beforeend', '<section class="native-window"><span class="lbl">Cordia skills</span>' + skills.map(function (skill) {
        return '<div class="step"><span style="flex:1">' + esc(skill.summary) + '</span>' +
          (skill.available ? '<button class="btn ghost" data-skill="' + esc(skill.id) + '" type="button" style="padding:6px 10px">Run</button>' : '<span class="gate">Connect first</span>') + '</div>';
      }).join('') + '</section>');
      host.querySelectorAll('[data-skill]').forEach(function (button) {
        button.addEventListener('click', function () {
          button.disabled = true;
          api('/surveyor/skill/execute', {id: button.getAttribute('data-skill')}).then(function (result) {
            button.disabled = false;
            if (result.code !== 200 || !result.data.ok) { notice((result.data && result.data.error) || 'Could not run that skill.'); return; }
            notice('Skill completed through Cordia’s read-only GitHub capability.');
            renderGithubWindow(); renderActivity();
          }).catch(function () { button.disabled = false; notice('Could not run that skill right now.'); });
        });
      });
    });
  }
  function renderActivity() {
    var host = document.getElementById('nativeWindows');
    api('/surveyor/activity').then(function (r) {
      var activity = r.data && r.data.activity;
      if (r.code !== 200 || !Array.isArray(activity) || !activity.length) return;
      host.insertAdjacentHTML('beforeend', '<section class="native-window"><span class="lbl">Recent activity</span>' + activity.slice(0, 5).map(function (event) {
        return '<div class="step"><span style="flex:1">' + esc(String(event.event_type || '').replace(/_/g, ' ')) + '</span></div>';
      }).join('') + '</section>');
    });
  }
  function renderMission() {
    var host = document.getElementById('nativeWindows');
    api('/surveyor/artifacts').then(function (r) {
      var artifacts = r.data && r.data.artifacts;
      if (r.code !== 200 || !artifacts) return;
      var mission = artifacts['runtime/fde-tasks.md'] || '';
      if (!mission) return;
      host.insertAdjacentHTML('beforeend', '<section class="native-window"><span class="lbl">Cordia mission</span><div class="step"><span style="white-space:pre-wrap;flex:1">' + esc(mission.replace(/^# FDE Mission Brief\s*/,'').trim()) + '</span></div></section>');
    });
  }
  function renderDerivedWindows(workspace) {
    var host = document.getElementById('nativeWindows');
    var windows = (workspace.windows || []).filter(function (window) { return window.kind === 'derived'; });
    if (!windows.length) return;
    host.insertAdjacentHTML('beforeend', '<section class="native-window"><span class="lbl">Your workspace notes</span>' + windows.map(function (window) {
      return '<div class="step"><span style="flex:1">' + esc(window.title || 'Untitled note') + '</span></div>';
    }).join('') + '</section>');
  }
  function renderContextSources(workspace) {
    var host = document.getElementById('nativeWindows');
    var sources = (workspace.context_sources || []).filter(function (source) { return source.kind !== 'artifact'; });
    if (!sources.length) return;
    host.insertAdjacentHTML('beforeend', '<section class="native-window"><span class="lbl">Active context</span>' + sources.map(function (source) {
      return '<div class="step"><span style="flex:1">' + esc(source.label || source.id) + '</span><button class="btn ghost" data-remove-context-kind="' + esc(source.kind) + '" data-remove-context-id="' + esc(source.id) + '" type="button" style="padding:5px 8px">Remove</button></div>';
    }).join('') + '</section>');
    host.querySelectorAll('[data-remove-context-id]').forEach(function (button) {
      button.addEventListener('click', function () {
        api('/surveyor/workspace/mutate', {id: id, mutation: {kind: 'remove_context_source',
          source_kind: button.getAttribute('data-remove-context-kind'), source_id: button.getAttribute('data-remove-context-id')}}).then(function (result) {
          if (result.code !== 200 || !result.data.workspace) { notice((result.data && result.data.error) || 'Could not remove that context.'); return; }
          render(result.data.workspace); notice('Context removed.');
        });
      });
    });
  }

  function render(workspace) {
    document.getElementById('title').textContent = workspace.title || 'Workspace';
    document.getElementById('desc').textContent = workspace.description || '';
    document.getElementById('editLink').href = 'builder.html?id=' + encodeURIComponent(workspace.id);
    window.CordiaWorkspaceNavigation.renderAlidoraNavigation(
      document.getElementById('alidoraNav'), workspace.id, document);

    var byId = {};
    (workspace.agents || []).forEach(function (a) { byId[a.id] = a.name; });
    var steps = (workspace.workflow || {}).steps || [];
    document.getElementById('nativeWindows').innerHTML = '';

    document.getElementById('steps').innerHTML = steps.length
      ? steps.map(function (s, i) {
          return '<div class="step"><i>' + (i + 1) + '</i>' +
            '<span style="flex:1">' + esc(byId[s.agentId] || s.agentId || 'Step') + '</span>' +
            (s.requiresApproval ? '<span class="gate">Your approval</span>' : '') + '</div>';
        }).join('')
      : '<div class="step"><span>No steps defined yet.</span></div>';

    if (steps.some(function (s) { return s.requiresApproval; })) {
      notice('This workspace pauses for your approval before anything final. '
           + 'Approval decisions are recorded durably; protected external continuation is not implemented yet.');
    }
    var githubConnector = (workspace.connectors || []).filter(function (connector) { return connector.id === 'github'; })[0];
    if (githubConnector && githubConnector.runtime_status === 'needs_attention') {
      notice('GitHub needs attention before Cordia can refresh repository data.');
    }
    if (githubConnector && githubConnector.lifecycle === 'needs_handoff') {
      notice('GitHub needs secure setup before Cordia can read repository data.');
    }
    if ((workspace.windows || []).some(function (window) {
      return window.kind === 'connector' && window.connector_id === 'github' && window.view === 'repositories';
    })) renderGithubWindow();
    renderApprovals();
    renderConnectors(workspace);
    renderCapabilities();
    renderSkills();
    renderActivity();
    renderMission();
    renderDerivedWindows(workspace);
    renderContextSources(workspace);
  }

  document.getElementById('runBtn').addEventListener('click', function () {
    var text = document.getElementById('input').value.trim();
    if (!text) { show('Type a request first.'); return; }
    var btn = this;
    btn.disabled = true;
    show('Running…');
    api('/surveyor/run', { id: id, input: text }).then(function (r) {
      btn.disabled = false;
      if (r.code !== 200 || !r.data.ok) {
        show((r.data && r.data.error) || 'The run failed. Nothing was saved.');
        return;
      }
      show(r.data.output || '(no output)');
      if (r.data.approval && r.data.approval.status === 'pending') {
        notice('Cordia prepared this draft and paused it for your approval. It has not taken the protected next step.');
      }
      if (r.data.llm && r.data.llm.live === false) notice(r.data.llm.note);
    }).catch(function () {
      btn.disabled = false;
      show('Connection lost. Nothing was saved.');
    });
  });

  document.getElementById('feedback').addEventListener('submit', function (event) {
    event.preventDefault();
    var correction = document.getElementById('missCorrection').value.trim();
    var effect = document.getElementById('missEffect').value.trim();
    if (!correction || !effect) { notice('Describe the correction and how future work should change.'); return; }
    api('/surveyor/intent-miss', { category: document.getElementById('missCategory').value,
      correction: correction, effect: effect }).then(function (r) {
      if (r.code !== 200 || !r.data.ok) { notice((r.data && r.data.error) || 'Could not save that correction.'); return; }
      document.getElementById('feedback').hidden = true;
      notice('Correction saved. Cordia refreshed its working mission for future runs.');
    });
  });

  document.getElementById('windowForm').addEventListener('submit', function (event) {
    event.preventDefault();
    var title = document.getElementById('windowTitle').value.trim();
    if (!id || !title) return;
    api('/surveyor/workspace/mutate', { id: id, mutation: { kind: 'add_window', window: {
      id: 'note-' + Date.now(), kind: 'derived', title: title } } }).then(function (r) {
      if (r.code !== 200 || !r.data.workspace) { notice((r.data && r.data.error) || 'Could not add that workspace note.'); return; }
      document.getElementById('windowTitle').value = '';
      render(r.data.workspace);
      notice('Workspace note added.');
    });
  });

  if (!id) {
    document.getElementById('title').textContent = 'No interface selected';
    document.getElementById('desc').textContent = 'Pick one from your workspaces.';
  } else {
    api('/surveyor/workspace?id=' + encodeURIComponent(id)).then(function (r) {
      if (r.code === 401) { document.getElementById('title').textContent = 'Sign in to run this'; return; }
      if (r.code !== 200 || !r.data.workspace) { document.getElementById('title').textContent = 'Workspace not found'; return; }
      render(r.data.workspace);
    });
  }
})();
</script>
</body>
</html>
